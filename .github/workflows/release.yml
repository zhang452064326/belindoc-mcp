# 发布到 PyPI / TestPyPI。
#
# 走 Trusted Publishing（OIDC）：仓库里不存任何 token，Actions 用 GitHub 签发的身份
# 去换一次性凭据。PyPI 和 TestPyPI 要各登记一次，「Workflow name」两边都填本文件的
# 文件名 release.yml。
#
# 两条路：
#   手动触发（Actions 页面点 Run workflow）→ 发 TestPyPI，用来验证流程
#   推 v* tag                              → 发正式 PyPI
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # OIDC 换凭据全靠它，少了这行 pypi-publish 会以「找不到身份」失败
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tag 和 pyproject 里的 version 必须一致。对不上就停在这里——PyPI 的同一个
      # 版本号只能传一次，传错了改不回来，只能跳版本号重发。
      - name: 核对 tag 与 version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject.version=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag 是 $tag，但 pyproject.toml 写的是 $ver"; exit 1; }

      # TestPyPI 同样不许重传同一个版本号，而验证流程往往要跑好几遍。给版本号缀上
      # .devN（N 是本次运行编号）保证每次都是新版本，不用为了重试去改 pyproject。
      # 只改工作区里的文件，不提交。
      - name: TestPyPI 用的版本号加 dev 后缀
        if: github.event_name == 'workflow_dispatch'
        run: |
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          dev="${ver}.dev${GITHUB_RUN_NUMBER}"
          python - "$ver" "$dev" <<'PY'
          import pathlib, sys
          old, new = sys.argv[1], sys.argv[2]
          p = pathlib.Path("pyproject.toml")
          s = p.read_text()
          assert f'version = "{old}"' in s
          p.write_text(s.replace(f'version = "{old}"', f'version = "{new}"', 1))
          print("本次发到 TestPyPI 的版本:", new)
          PY

      - name: 构建
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: 发到 TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: 发到 PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
