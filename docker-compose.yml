version: '3.8'

services:
  trans-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      # 落地页占用 /mcp 时改这里，客户端 URL 要同步改
      - MCP_PATH=${MCP_PATH:-/mcp}
      # 上游地址，不设即测试环境；生产环境传 https://belindoc.com/api
      - BELINDOC_API_BASE_URL=${BELINDOC_API_BASE_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
