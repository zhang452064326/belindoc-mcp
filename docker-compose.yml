version: '3.8'

services:
  trans-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      - BELINDOC_API_KEY=${BELINDOC_API_KEY}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
