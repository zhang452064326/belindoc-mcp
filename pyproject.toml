[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trans-mcp"
version = "0.1.0"
description = "MCP Server for document translation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    # HTTP 模式的传输层：MCP SDK 的 Streamable HTTP 管理器是 ASGI 的，
    # 挂在 Starlette 上、由 uvicorn 跑。（之前手搓的那套用的是 aiohttp）
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
trans-mcp = "trans_mcp.server:main"
trans-mcp-http = "trans_mcp.http_server:main"

[tool.pytest.ini_options]
# 根目录的 test_api.py / test_upload.py 是手动连真实 API 的冒烟脚本，
# 不是用例，只收集 tests/ 避免被误收集
testpaths = ["tests"]
