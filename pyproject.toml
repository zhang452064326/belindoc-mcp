[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belindoc-mcp"
version = "0.1.0"
description = "Belindoc 文档 / 视频翻译的 MCP 服务"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "zhangjun"}]
keywords = ["mcp", "translation", "document", "video", "subtitle"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    # HTTP 模式的传输层：MCP SDK 的 Streamable HTTP 管理器是 ASGI 的，
    # 挂在 Starlette 上、由 uvicorn 跑。（之前手搓的那套用的是 aiohttp）
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://belindoc.com"

# PyPI 包名是 belindoc-mcp，仓库目录和模块仍叫 trans-mcp / trans_mcp——后两个用户
# 看不见，跟着改要动 Dockerfile 的 CMD、systemd 的 ExecStart 和已在跑的服务器的升级
# 路径，不值当。
#
# belindoc-mcp 是给外部用户的 stdio 入口，名字和包名一致，客户端里直接 uvx belindoc-mcp。
# trans-mcp / trans-mcp-http 原样留着：start.sh、Dockerfile、systemd 单元都在调它们。
[project.scripts]
belindoc-mcp = "trans_mcp.server:main"
trans-mcp = "trans_mcp.server:main"
trans-mcp-http = "trans_mcp.http_server:main"

# 显式声明要打的包。原先靠自动发现，而 src/ 下有个空的 __init__.py，setuptools
# 把它当成了一个顶层模块——egg-info 的 top_level.txt 里真有一行 `__init__`。
# 自用无所谓，发到 PyPI 就是往每个用户的 site-packages 里塞一个叫 __init__ 的
# 顶层模块。那个空文件已经删掉，这里再钉死一遍，防止以后又被误收。
[tool.setuptools.packages.find]
where = ["src"]
include = ["trans_mcp*"]

[tool.pytest.ini_options]
# 根目录的 test_api.py / test_upload.py 是手动连真实 API 的冒烟脚本，
# 不是用例，只收集 tests/ 避免被误收集
testpaths = ["tests"]
